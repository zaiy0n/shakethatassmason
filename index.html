<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wait for it...</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Comic Sans MS', cursive;
        }

        /* The Erratic GIF Animation */
        #crazy-gif {
            position: absolute;
            width: 150px;
            top: -200px; /* Starts completely off-screen at the top */
            animation: dropIn 0.5s forwards, zipAround 1.5s infinite 0.5s linear;
            z-index: 10;
        }

        /* First phase: Drop quickly from the top to the center */
        @keyframes dropIn {
            0% { top: -200px; }
            100% { top: 50%; transform: translateY(-50%); }
        }

        /* Second phase: Fly wildly in circles and zip left/right */
        @keyframes zipAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(250px, -180px) rotate(90deg); }
            50% { transform: translate(-250px, 180px) rotate(180deg); }
            75% { transform: translate(200px, 200px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* The Bait Button */
        #troll-button {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff0000, #ffcc00);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: 0.2s;
        }

        #troll-button:hover {
            transform: scale(1.1);
        }

        /* The 4K Video Styling - Forced Full Screen */
        #prank-video {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Forces the video to stretch and fill the whole screen */
            z-index: 100;
            background: black;
        }
    </style>
</head>
<body>

    <img src="bait.gif.GIF" id="crazy-gif" alt="bait">

    <button id="troll-button">click here mason!😡</button>

    <video id="prank-video">
        <source src="caught.mp4.MP4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const btn = document.getElementById('troll-button');
        const video = document.getElementById('prank-video');
        const gif = document.getElementById('crazy-gif');

        btn.addEventListener('click', () => {
            // Immediately hide the flying gif and the button
            gif.style.display = 'none';
            btn.style.display = 'none';

            // Show the full-screen video element
            video.style.display = 'block';
            
            // Force play the video (browsers allow sound now since the user clicked)
            video.play().catch(error => {
                console.log("Playback failed. Please try interacting with the page.", error);
            });

            // What happens when the 4-second video finishes playing
            video.onended = () => {
                document.body.innerHTML = "<h1 style='color:white; text-align:center; font-size: 50px; font-family: sans-serif;'>aye come get your lolipop in my pants 👅</h1>";
            };
        });
    </script>
</body>
</html>
